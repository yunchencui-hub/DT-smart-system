# Mosquitto broker config for Robin.
# Start it with:   mosquitto -c broker/mosquitto.conf -v
#
# Mosquitto 2.x only listens on localhost by default. The robot is another device on the WiFi,
# so we must listen on all network interfaces (0.0.0.0) and, for this prototype, allow clients
# without a password. That is acceptable on your own phone hotspot, NOT on a shared network.
# Production would add: password_file, TLS on port 8883, and ACLs per topic (see docs/02_design.md).

listener 1883 0.0.0.0
allow_anonymous true

# Keep retained messages (robot online/offline status) across broker restarts
persistence true
persistence_location ./

connection_messages true
log_type error
log_type warning
log_type notice
